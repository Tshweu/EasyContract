@if(loading){
<mat-spinner></mat-spinner>
}@else{
<mat-toolbar class="blue-primary-toolbar">
    <h4>Review the contract before submission</h4>
    <span class="spacer"></span>
    <button mat-raised-button (click)="reject()">Reject</button>
</mat-toolbar>
<div class="container">
    <div class="terms" [innerHTML]="contract?.terms"></div>
    <button id="submit-template" mat-raised-button (click)="submit()">
        I agree to the terms and conditions
    </button>
</div>
}
